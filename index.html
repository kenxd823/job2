<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กรอกข้อมูลส่วนตัว</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>กรอกข้อมูลส่วนตัว</h1>
        <form id="userForm">
            <div class="form-group">
                <label for="name">ชื่อ:</label>
                <input type="text" id="name" name="name" placeholder="กรอกชื่อ" required>
            </div>

            <div class="form-group">
                <label for="lastname">นามสกุล:</label>
                <input type="text" id="lastname" name="lastname" placeholder="กรอกนามสกุล" required>
            </div>

            <div class="form-group">
                <label for="age">อายุ:</label>
                <input type="text" id="age" name="age" inputmode="numeric" maxlength="3" pattern="[0-9]{1,3}" placeholder="กรอกอายุ" required>
            </div>

            <button type="submit">ส่งข้อมูล</button>
        </form>
    </div>

</body>
</html>
